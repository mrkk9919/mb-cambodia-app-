<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>MB Cambodia — Banking Home UI Prototype</title>
    <meta name="description" content="MB Cambodia mobile banking home screen UI prototype — demo data only, no live transactions." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="MB Cambodia — Banking Home UI Prototype" />
    <meta property="og:description" content="MB Cambodia mobile banking home screen UI prototype — demo data only, no live transactions." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MB Cambodia — Banking Home UI Prototype" />
    <meta name="twitter:description" content="MB Cambodia mobile banking home screen UI prototype — demo data only, no live transactions." />
    <link rel="icon" type="image/svg+xml" href="/mb-cambodia-app-/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script type="module" crossorigin src="/mb-cambodia-app-/assets/index-tGulQzRr.js"></script>
    <link rel="stylesheet" crossorigin href="/mb-cambodia-app-/assets/index-BIeGMN93.css">
    <link rel="stylesheet" href="./scan.css?v=1">
  </head>
  <body>
    <div id="root"></div>

    <main id="qr-scan" role="dialog" aria-modal="true" aria-label="Scan QR" aria-hidden="true">
      <div class="qr-camera-scene" aria-hidden="true">
        <div class="scene-shadow scene-shadow--left"></div>
        <div class="scene-object"></div>
        <div class="scene-table"></div>
        <div class="scene-light"></div>
        <div class="scene-vignette"></div>
      </div>

      <header class="qr-header">
        <button class="back-button" type="button" aria-label="Go back">
          <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M19 12H5" />
            <path d="M12 19l-7-7 7-7" />
          </svg>
        </button>
        <h1>Scan QR</h1>
        <span class="header-balance" aria-hidden="true"></span>
      </header>

      <section class="scanner-content" aria-label="QR code scanner">
        <div class="qr-frame" aria-label="QR code alignment frame">
          <div class="frame-empty-state" aria-hidden="true"></div>
          <video class="camera-video" id="qr-camera" playsinline muted autoplay aria-hidden="true"></video>
          <div class="selected-image" id="qr-selected" hidden>
            <img id="qr-selected-img" alt="" />
            <div class="selected-image-label">Image ready to scan</div>
          </div>
          <span class="qr-corner qr-corner--tl"></span>
          <span class="qr-corner qr-corner--tr"></span>
          <span class="qr-corner qr-corner--bl"></span>
          <span class="qr-corner qr-corner--br"></span>
        </div>

        <p class="scanner-instruction" id="qr-instruction">Align frame with QR code</p>
        <p class="camera-hint" id="qr-camera-hint" hidden></p>

        <div class="scanner-actions">
          <button class="scanner-action" id="qr-flash" type="button" aria-pressed="false">
            <span>Flash</span>
            <span class="flash-state" id="qr-flash-state" aria-live="polite"></span>
          </button>
          <button class="scanner-action upload-action" id="qr-upload" type="button">
            <span>Upload QR</span>
          </button>
          <input class="file-input" id="qr-file" type="file" accept="image/*" aria-label="Choose a QR code image" />
        </div>

        <p class="selected-file" id="qr-selected-file" role="status" hidden>
          <span class="file-indicator" aria-hidden="true"></span>
          <span class="selected-file-name" id="qr-selected-name"></span>
        </p>
      </section>

      <footer class="payment-support">
        <p>Support payment:</p>
        <div class="provider-marks" aria-label="KHQR and ATM MB Cambodia">
          <img class="provider-logo-image" src="./payment-providers.png" alt="KHQR and ATM MB Cambodia" />
        </div>
      </footer>

      <div class="system-home-indicator" aria-hidden="true"><span></span></div>
      <div class="scan-toast" id="qr-toast" role="status" aria-live="polite"></div>

      <!-- payment sheet -->
      <div id="qr-pay" aria-hidden="true">
        <div class="pay-backdrop"></div>

        <section class="pay-sheet" role="dialog" aria-modal="true" aria-label="Payment">
          <div class="pay-handle" aria-hidden="true"></div>
          <div class="pay-head">
            <span class="pay-label">Pay with MB Cambodia</span>
            <button class="pay-close" id="pay-close" type="button" aria-label="Close payment">&times;</button>
          </div>

          <div class="pay-merchant">
            <div class="pay-avatar" id="pay-avatar" aria-hidden="true">QR</div>
            <div>
              <p class="pay-name" id="pay-name">Merchant</p>
              <p class="pay-sub" id="pay-sub">KHQR</p>
            </div>
          </div>

          <div class="pay-amount-box">
            <div class="pay-amount-line">
              <span class="pay-cur" id="pay-cur">$</span>
              <input class="pay-amount" id="pay-amount" inputmode="decimal" placeholder="0.00"
                     aria-label="Amount" autocomplete="off" />
            </div>
            <p class="pay-amount-hint">Amount</p>
          </div>

          <div class="pay-meta">
            <div><span>Reference</span><span id="pay-ref">—</span></div>
            <div><span>Fee</span><span>Free</span></div>
          </div>

          <button class="pay-btn" id="pay-confirm" type="button" disabled>Pay now</button>
          <p class="pay-note">Demo only — no real funds are moved.</p>
        </section>

        <section class="pay-success" role="dialog" aria-modal="true" aria-label="Payment successful">
          <div class="success-badge">
            <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 6L9 17l-5-5" />
            </svg>
          </div>
          <h2>Payment successful</h2>
          <p class="success-amount" id="success-amount">$ 0.00</p>
          <p class="success-to" id="success-to">to Merchant</p>
          <div class="success-rows">
            <div><span>Reference</span><span id="success-ref">—</span></div>
            <div><span>Time</span><span id="success-time">—</span></div>
            <div><span>Status</span><span>Completed</span></div>
          </div>
          <button class="pay-btn" id="pay-done" type="button">Done</button>
        </section>
      </div>
    </main>

    <script src="./jsqr.min.js"></script>
    <script src="./scan.js?v=1"></script>
  </body>
</html>
