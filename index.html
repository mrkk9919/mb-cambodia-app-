    <style>
      /* ---------- Scan QR screen ---------- */
      #qr-scan {
        --ink: #fffdf9;
        --soft-ink: rgba(255, 253, 249, 0.94);
        --accent: #dce9d3;
        position: fixed;
        inset: 0;
        z-index: 9999;
        isolation: isolate;
        width: 100%;
        height: 100dvh;
        min-height: 620px;
        overflow: hidden;
        color: var(--ink);
        background: #171513;
        font-family: "DM Sans", "Avenir Next", Inter, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 0.18s ease;
      }
      #qr-scan.open { opacity: 1; visibility: visible; pointer-events: auto; }
      #qr-scan *, #qr-scan *::before, #qr-scan *::after { box-sizing: border-box; }
      #qr-scan [hidden] { display: none !important; }

      #qr-scan .qr-camera-scene {
        position: absolute;
        z-index: -2;
        inset: -34px;
        overflow: hidden;
        background:
          radial-gradient(ellipse at 72% 19%, rgba(205, 205, 187, 0.55) 0 17%, transparent 37%),
          radial-gradient(ellipse at 51% 42%, rgba(157, 151, 127, 0.54) 0 20%, transparent 37%),
          radial-gradient(ellipse at 15% 76%, rgba(119, 73, 56, 0.42) 0 13%, transparent 28%),
          linear-gradient(146deg, #25221f 0%, #38342c 40%, #655b4e 66%, #302b28 100%);
        filter: blur(8px);
        transform: scale(1.035);
        transition: filter 220ms ease;
      }
      #qr-scan .scene-shadow { position: absolute; border-radius: 50%; filter: blur(11px); }
      #qr-scan .scene-shadow--left {
        top: -7%; left: 4%; width: 48%; height: 36%;
        background: radial-gradient(ellipse at 54% 43%, #060808 0 31%, #111612 49%, rgba(8, 10, 9, 0) 71%);
        transform: rotate(21deg);
      }
      #qr-scan .scene-object {
        position: absolute; top: 8%; left: 33%; width: 48%; height: 30%;
        border-radius: 7% 10% 9% 15%;
        background: linear-gradient(119deg, rgba(59, 49, 34, 0.93), rgba(140, 126, 98, 0.78) 39%, rgba(221, 220, 200, 0.86) 76%);
        filter: blur(15px);
        transform: rotate(10deg);
      }
      #qr-scan .scene-table {
        position: absolute; inset: 34% -5% 9%;
        background:
          radial-gradient(ellipse at 66% 14%, rgba(234, 231, 212, 0.57), transparent 40%),
          radial-gradient(ellipse at 13% 58%, rgba(74, 57, 45, 0.25), transparent 43%),
          repeating-linear-gradient(4deg, rgba(246, 240, 219, 0.08) 0 1px, transparent 1px 5px),
          linear-gradient(171deg, rgba(188, 183, 161, 0.8), rgba(145, 137, 117, 0.64) 55%, rgba(77, 70, 61, 0.78));
        filter: blur(13px);
        transform: rotate(-2deg);
      }
      #qr-scan .scene-light {
        position: absolute; top: 31%; left: -10%; width: 33%; height: 42%;
        border-radius: 40%; background: rgba(131, 74, 54, 0.8);
        filter: blur(24px); transform: rotate(-8deg);
      }
      #qr-scan .scene-vignette {
        position: absolute; inset: 0;
        background:
          linear-gradient(180deg, rgba(0, 0, 0, 0.46), transparent 23%, transparent 65%, rgba(8, 7, 7, 0.76)),
          linear-gradient(90deg, rgba(0, 0, 0, 0.36), transparent 22%, transparent 76%, rgba(0, 0, 0, 0.38)),
          rgba(10, 10, 9, 0.31);
      }
      #qr-scan.flash .qr-camera-scene { filter: blur(6px) brightness(1.42); }
      #qr-scan.flash .frame-empty-state { filter: brightness(1.24); }

      #qr-scan .qr-header {
        position: absolute; top: max(20px, env(safe-area-inset-top)); left: 0; right: 0;
        height: 44px; display: grid; grid-template-columns: 1fr auto 1fr;
        align-items: center; padding: 0 26px;
      }
      #qr-scan .qr-header h1 {
        margin: 0; font-size: 21px; line-height: 1; font-weight: 600; letter-spacing: -0.5px;
      }
      #qr-scan .back-button {
        display: flex; align-items: center; justify-self: start;
        width: 38px; height: 42px; padding: 0; color: var(--ink);
        border: 0; background: none; cursor: pointer;
      }
      #qr-scan .back-button:focus-visible,
      #qr-scan .scanner-action:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }
      #qr-scan .header-balance { justify-self: end; width: 38px; }

      #qr-scan .scanner-content {
        position: absolute; top: clamp(112px, 14.4vh, 148px); left: 0; width: 100%;
        display: flex; align-items: center; flex-direction: column;
      }
      #qr-scan .qr-frame {
        position: relative; display: grid; place-items: center;
        width: min(78vw, 394px); aspect-ratio: 1;
        border: 1px solid rgba(255, 255, 255, 0.17);
        background: rgba(251, 249, 235, 0.035);
        box-shadow: 0 0 0 999px rgba(5, 5, 5, 0.13);
      }
      #qr-scan .frame-empty-state {
        width: 100%; height: 100%;
        background:
          linear-gradient(rgba(18, 18, 16, 0.15), rgba(18, 18, 16, 0.15)),
          url("./qr-camera-feed.jpg") center / cover;
        transition: filter 220ms ease;
      }
      #qr-scan .qr-corner {
        position: absolute; z-index: 2; width: 18px; height: 18px;
        border-color: #fff; border-style: solid;
        filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.2));
      }
      #qr-scan .qr-corner--tl { top: -1px; left: -1px; border-width: 4px 0 0 4px; }
      #qr-scan .qr-corner--tr { top: -1px; right: -1px; border-width: 4px 4px 0 0; }
      #qr-scan .qr-corner--bl { bottom: -1px; left: -1px; border-width: 0 0 4px 4px; }
      #qr-scan .qr-corner--br { bottom: -1px; right: -1px; border-width: 0 4px 4px 0; }

      #qr-scan .selected-image {
        position: absolute; inset: 0; display: grid; place-items: center;
        overflow: hidden; background: rgba(10, 10, 10, 0.7);
      }
      #qr-scan .selected-image img {
        display: block; width: 100%; height: 100%; object-fit: contain;
      }
      #qr-scan .selected-image-label {
        position: absolute; right: 10px; bottom: 10px; padding: 6px 9px;
        color: #fff; border: 1px solid rgba(255, 255, 255, 0.28); border-radius: 6px;
        background: rgba(10, 10, 10, 0.72); font-size: 11px;
      }

      #qr-scan .scanner-instruction {
        margin: 50px 16px 0; color: var(--soft-ink);
        font-size: 18px; line-height: 1.25; font-weight: 400; text-align: center;
        text-shadow: 0 1px 5px rgba(0, 0, 0, 0.34);
      }
      #qr-scan .scanner-actions {
        display: flex; justify-content: center; gap: 13px; margin-top: 40px;
      }
      #qr-scan .scanner-action {
        position: relative; display: inline-flex; justify-content: center; align-items: center;
        gap: 9px; min-width: 115px; height: 45px; padding: 0 18px;
        color: var(--ink); border: 1.4px solid rgba(255, 255, 255, 0.96); border-radius: 9px;
        background: rgba(12, 12, 11, 0.19); font: inherit; font-size: 16px; line-height: 1;
        cursor: pointer;
        transition: background 160ms ease, border-color 160ms ease, transform 160ms ease;
        -webkit-backdrop-filter: blur(5px);
        backdrop-filter: blur(5px);
      }
      #qr-scan .scanner-action:hover { background: rgba(255, 255, 255, 0.12); }
      #qr-scan .scanner-action:active { transform: scale(0.98); }
      #qr-scan .scanner-action.active {
        background: rgba(233, 239, 221, 0.22);
        border-color: var(--accent);
        box-shadow: inset 0 0 0 1px rgba(233, 239, 221, 0.13);
      }
      #qr-scan .flash-state {
        position: absolute; top: -7px; right: 7px; padding: 2px 5px;
        color: #22281e; border-radius: 5px; background: #e4edd8;
        font-size: 9px; font-weight: 700; letter-spacing: 0.3px;
      }
      #qr-scan .flash-state:empty { display: none; }
      #qr-scan .file-input {
        position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
        overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
      }
      #qr-scan .selected-file {
        display: flex; align-items: center; gap: 8px;
        max-width: min(84vw, 350px); margin: 12px 0 0; padding: 6px 10px;
        border: 1px solid rgba(255, 255, 255, 0.22); border-radius: 20px;
        background: rgba(12, 12, 11, 0.58); color: rgba(255, 255, 255, 0.94); font-size: 12px;
      }
      #qr-scan .file-indicator {
        width: 6px; height: 6px; flex: 0 0 auto; border-radius: 50%; background: #dce9d3;
      }
      #qr-scan .selected-file-name {
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }

      #qr-scan .payment-support {
        position: absolute; left: 0; right: 0;
        bottom: calc(max(65px, env(safe-area-inset-bottom) + 52px));
        display: flex; align-items: center; flex-direction: column;
      }
      #qr-scan .payment-support p {
        margin: 0 0 12px; color: rgba(255, 255, 255, 0.9);
        font-size: 17px; line-height: 1.25; font-weight: 400;
        text-shadow: 0 1px 5px rgba(0, 0, 0, 0.32);
      }
      #qr-scan .provider-marks { display: flex; align-items: center; justify-content: center; }
      #qr-scan .provider-logo-image {
        display: block; width: min(68vw, 210px); height: auto; object-fit: contain;
      }

      #qr-scan .system-home-indicator {
        position: absolute; right: 0; bottom: max(8px, env(safe-area-inset-bottom)); left: 0;
        display: flex; justify-content: center;
      }
      #qr-scan .system-home-indicator span {
        width: 138px; height: 5px; border-radius: 999px; background: rgba(255, 255, 255, 0.93);
      }

      @media (max-height: 740px) {
        #qr-scan { min-height: 560px; }
        #qr-scan .scanner-content { top: 104px; }
        #qr-scan .qr-frame { width: min(70vw, 290px); }
        #qr-scan .scanner-instruction { margin-top: 26px; font-size: 18px; }
        #qr-scan .scanner-actions { margin-top: 24px; }
        #qr-scan .payment-support { bottom: calc(max(52px, env(safe-area-inset-bottom) + 42px)); }
        #qr-scan .payment-support p { margin-bottom: 10px; font-size: 17px; }
      }
      @media (max-width: 360px) {
        #qr-scan .qr-frame { width: min(78vw, 300px); }
        #qr-scan .scanner-actions { gap: 10px; }
        #qr-scan .scanner-action { min-width: 132px; padding: 0 13px; font-size: 16px; }
      }
      @media (prefers-reduced-motion: reduce) {
        #qr-scan, #qr-scan .qr-camera-scene, #qr-scan .frame-empty-state, #qr-scan .scanner-action {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <main id="qr-scan" role="dialog" aria-modal="true" aria-label="Scan QR" aria-hidden="true">
      <div class="qr-camera-scene" aria-hidden="true">
        <div class="scene-shadow scene-shadow--left"></div>
        <div class="scene-object"></div>
        <div class="scene-table"></div>
        <div class="scene-light"></div>
        <div class="scene-vignette"></div>
      </div>

      <header class="qr-header">
        <button class="back-button" type="button" aria-label="Go back">
          <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M19 12H5" />
            <path d="M12 19l-7-7 7-7" />
          </svg>
        </button>
        <h1>Scan QR</h1>
        <span class="header-balance" aria-hidden="true"></span>
      </header>

      <section class="scanner-content" aria-label="QR code scanner">
        <div class="qr-frame" aria-label="QR code alignment frame">
          <div class="frame-empty-state" aria-hidden="true"></div>
          <div class="selected-image" id="qr-selected" hidden>
            <img id="qr-selected-img" alt="" />
            <div class="selected-image-label">Image ready to scan</div>
          </div>
          <span class="qr-corner qr-corner--tl"></span>
          <span class="qr-corner qr-corner--tr"></span>
          <span class="qr-corner qr-corner--bl"></span>
          <span class="qr-corner qr-corner--br"></span>
        </div>

        <p class="scanner-instruction" id="qr-instruction">Align frame with QR code</p>

        <div class="scanner-actions">
          <button class="scanner-action" id="qr-flash" type="button" aria-pressed="false">
            <span>Flash</span>
            <span class="flash-state" id="qr-flash-state" aria-live="polite"></span>
          </button>
          <button class="scanner-action upload-action" id="qr-upload" type="button">
            <span>Upload QR</span>
          </button>
          <input class="file-input" id="qr-file" type="file" accept="image/*" aria-label="Choose a QR code image" />
        </div>

        <p class="selected-file" id="qr-selected-file" role="status" hidden>
          <span class="file-indicator" aria-hidden="true"></span>
          <span class="selected-file-name" id="qr-selected-name"></span>
        </p>
      </section>

      <footer class="payment-support">
        <p>Support payment:</p>
        <div class="provider-marks" aria-label="KHQR and ATM MB Cambodia">
          <img class="provider-logo-image" src="./payment-providers.png" alt="KHQR and ATM MB Cambodia" />
        </div>
      </footer>

      <div class="system-home-indicator" aria-hidden="true"><span></span></div>
    </main>

    <script>
      (function () {
        var overlay = document.getElementById("qr-scan");
        if (!overlay || overlay.dataset.ready) return;
        overlay.dataset.ready = "1";

        var backBtn = overlay.querySelector(".back-button");
        var flashBtn = document.getElementById("qr-flash");
        var flashState = document.getElementById("qr-flash-state");
        var uploadBtn = document.getElementById("qr-upload");
        var fileInput = document.getElementById("qr-file");
        var instruction = document.getElementById("qr-instruction");
        var selectedBox = document.getElementById("qr-selected");
        var selectedImg = document.getElementById("qr-selected-img");
        var selectedFile = document.getElementById("qr-selected-file");
        var selectedName = document.getElementById("qr-selected-name");
        var objectUrl = null;

        function clearSelected() {
          if (objectUrl) { URL.revokeObjectURL(objectUrl); objectUrl = null; }
          selectedBox.hidden = true;
          selectedFile.hidden = true;
          selectedImg.removeAttribute("src");
          selectedName.textContent = "";
          instruction.textContent = "Align frame with QR code";
        }

        function open() {
          overlay.classList.add("open");
          overlay.setAttribute("aria-hidden", "false");
          document.documentElement.style.overflow = "hidden";
          setTimeout(function () { backBtn.focus(); }, 80);
        }

        function close() {
          overlay.classList.remove("open");
          overlay.setAttribute("aria-hidden", "true");
          document.documentElement.style.overflow = "";
          overlay.classList.remove("flash");
          flashBtn.classList.remove("active");
          flashBtn.setAttribute("aria-pressed", "false");
          flashState.textContent = "";
          fileInput.value = "";
          clearSelected();
        }

        backBtn.addEventListener("click", close);

        flashBtn.addEventListener("click", function () {
          var on = overlay.classList.toggle("flash");
          flashBtn.classList.toggle("active", on);
          flashBtn.setAttribute("aria-pressed", on ? "true" : "false");
          flashState.textContent = on ? "On" : "";
        });

        uploadBtn.addEventListener("click", function () { fileInput.click(); });

        fileInput.addEventListener("change", function (event) {
          var file = event.target.files && event.target.files[0];
          if (!file) return;
          clearSelected();
          objectUrl = URL.createObjectURL(file);
          selectedImg.src = objectUrl;
          selectedImg.alt = "Selected image: " + file.name;
          selectedBox.hidden = false;
          selectedName.textContent = file.name;
          selectedName.title = file.name;
          selectedFile.hidden = false;
          instruction.textContent = "Image selected";
          event.target.value = "";
        });

        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape" && overlay.classList.contains("open")) close();
        });

        // open the scanner from the app's QR entry points without letting the
        // React handler show its "not connected" toast
        document.addEventListener("click", function (e) {
          if (overlay.classList.contains("open")) return;
          var el = e.target && e.target.closest ? e.target.closest("[aria-label]") : null;
          if (!el || el.closest("#qr-scan")) return;
          var label = (el.getAttribute("aria-label") || "").toLowerCase();
          if (label.indexOf("quét") > -1 || label.indexOf("scan") > -1) {
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
            open();
          }
        }, true);

        window.mbScanQR = { open: open, close: close };
      })();
    </script>
  </body>
