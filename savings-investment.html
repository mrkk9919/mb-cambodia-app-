<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" content="#0877ef" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MB Cambodia" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Savings &amp; Invest — MB Cambodia</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" sizes="192x192" href="./app-icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="stylesheet" href="./pwa-install.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Sans:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./international-transfer.css" />
    <link rel="stylesheet" href="./savings-investment.css" />
  </head>
  <body>
    <div class="it-app">
      <header class="it-header">
        <div class="it-status" aria-hidden="true">
          <span>08:04</span>
          <span class="it-status-right">
            <svg class="it-signal" viewBox="0 0 22 18"><path d="M2 16V11h4v5M9 16V7h4v9M16 16V3h4v13" /></svg>
            <svg class="it-wifi" viewBox="0 0 22 18"><path d="M2 6c5-5 13-5 18 0M5 9c3-3 9-3 12 0M8 12c2-2 4-2 6 0M11 15h.01" /></svg>
            <span class="it-battery">90</span>
          </span>
        </div>
        <nav class="it-nav" aria-label="Savings navigation">
          <a class="it-nav-button" href="./index.html" aria-label="Go back">
            <svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7" /></svg>
          </a>
          <h1>Savings &amp; Invest</h1>
          <a class="it-nav-button" href="./index.html" aria-label="Home">
            <svg class="it-home-icon" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z" /></svg>
          </a>
        </nav>
      </header>

      <main class="it-main si-main">
        <svg class="it-watermark" viewBox="0 0 400 400" aria-hidden="true">
          <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="42">
            <path d="M200 28v94M200 278v94M28 200h94M278 200h94" />
            <path d="m78 78 67 67m110 110 67 67M322 78l-67 67M145 255l-67 67" />
          </g>
        </svg>

        <div class="si-list" role="group" aria-label="Savings services">
          <button class="si-option" type="button" data-savings-option="fixed" aria-pressed="false">
            <span class="si-icon" aria-hidden="true">
              <svg viewBox="0 0 44 44">
                <rect class="si-icon-frame" x="2" y="2" width="40" height="40" rx="8" />
                <circle cx="14" cy="25" r="6" />
                <path d="M14 21v8m-2-6h4m-4 3h4M23 15h11M23 21h11M23 27h11M23 33h8" />
              </svg>
            </span>
            <span class="si-copy">
              <strong class="si-title">Open Fixed Deposit</strong>
              <span>Open a Fixed Deposit and enjoy our interesting rate right away!</span>
            </span>
            <svg class="si-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7" /></svg>
          </button>

          <button class="si-option" type="button" data-savings-option="realtime" aria-pressed="false">
            <span class="si-icon" aria-hidden="true">
              <svg viewBox="0 0 44 44">
                <rect class="si-icon-frame" x="2" y="2" width="40" height="40" rx="8" />
                <path d="M14 16h10v17H14zM12 19h14M17 14h4M29 21c3 1 5 3 5 6s-2 5-5 6M29 24c2 1 3 2 3 3s-1 2-3 3M27 18l3-3m-3 0h3v3" />
                <circle cx="19" cy="28" r="2" />
              </svg>
            </span>
            <span class="si-copy">
              <strong class="si-title">Open Real-time Deposit</strong>
              <span>Open a Real-time Deposit, can withdraw before maturity, still earn the attractive interest rate.</span>
            </span>
            <svg class="si-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7" /></svg>
          </button>

          <button class="si-option si-option-hot" type="button" data-savings-option="flexi" aria-pressed="false">
            <span class="si-hot">Hot</span>
            <span class="si-icon" aria-hidden="true">
              <svg viewBox="0 0 44 44">
                <rect class="si-icon-frame" x="2" y="2" width="40" height="40" rx="8" />
                <path d="M12 25c0-5 4-8 11-8h7l4 4v9h-4a8 8 0 0 1-7 4h-6c-4 0-7-3-7-7v-2c0-1 1-1 2-1ZM15 16c-2-3 0-6 4-6m-9 14c-3-1-4-4-2-6m12-1v-3m10 18v3" />
                <circle cx="28" cy="23" r="1" />
                <circle cx="31" cy="13" r="4" />
                <path d="M31 11v4m-1-3h2m-2 2h2" />
              </svg>
            </span>
            <span class="si-copy">
              <strong class="si-title">Open Flexi Term Deposit</strong>
              <span>Initial deposit of $5.00 or ៛20,000.00. Top-up at any time, anywhere from $1.00 or ៛4,000.00. Interest rate up to <em>5.5%</em> / year.</span>
            </span>
            <svg class="si-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7" /></svg>
          </button>

          <button class="si-option si-option-query is-selected" type="button" data-savings-option="query" aria-pressed="true">
            <span class="si-icon" aria-hidden="true">
              <svg viewBox="0 0 44 44">
                <rect class="si-icon-frame" x="2" y="2" width="40" height="40" rx="8" />
                <path d="M13 14h18M16 10h12m-16 9h20v15H12z" />
                <rect x="16" y="22" width="12" height="7" rx="1" />
                <circle cx="22" cy="25.5" r="1.5" />
              </svg>
            </span>
            <span class="si-copy"><strong class="si-title">Query Savings</strong></span>
            <svg class="si-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7" /></svg>
          </button>
        </div>
      </main>

      <p class="si-toast" id="si-toast" role="status" aria-live="polite" hidden></p>
      <div class="it-home-indicator" aria-hidden="true"><span></span></div>
    </div>
    <script src="./savings-investment.js"></script>
    <script src="./pwa-install.js"></script>
  </body>
</html>
